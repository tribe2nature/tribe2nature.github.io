<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9fafb;
      color: #111827;
      text-align: center;
      padding: 20px;
    }

    .corner-note {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 0.85rem;
      font-style: italic;
      color: #6b7280;
    }

    main {
      max-width: 600px;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    p {
      font-size: clamp(1.125rem, 2.5vw, 1.375rem);
      color: #4b5563;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <span class="corner-note">Du hast für "Schlaf, Energie & innere Balance" gestimmt</span>

  <main>
    <h1>Vielen Dank!</h1>
    <p>Wir wissen deine Zeit zu schätzen. Dein Feedback hilft uns, unsere Inhalte entsprechend abzustimmen.</p>
  </main>
</body>
</html>
